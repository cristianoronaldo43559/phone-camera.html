<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phone Camera → PC</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .box {
      max-width: 750px;
      margin: 20px auto;
      padding: 22px;
      background: #191c22;
      border-radius: 18px;
    }

    button,
    input {
      padding: 13px 18px;
      margin: 6px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    input {
      width: 200px;
      text-align: center;
      letter-spacing: 3px;
    }

    video {
      width: 100%;
      max-height: 65vh;
      margin-top: 18px;
      background: #000;
      border-radius: 14px;
    }

    #code {
      margin: 20px 0;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
    }

    .status {
      margin: 15px;
      color: #aaa;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h1>📱 Phone Camera → 💻 PC</h1>

  <!-- MODE -->
  <div class="box">

    <button onclick="phoneMode()">
      📱 PHONE
    </button>

    <button onclick="pcMode()">
      💻 COMPUTER
    </button>

  </div>


  <!-- ========================= -->
  <!-- PHONE -->
  <!-- ========================= -->

  <div id="phoneBox" class="box hidden">

    <h2>📱 Phone Camera</h2>

    <button onclick="startPhone()">
      Start Camera
    </button>

    <div id="code">
      ------
    </div>

    <p>
      Enter this 6-digit code on your computer.
    </p>

    <div id="phoneStatus" class="status">
      Camera not started.
    </div>

    <video
      id="phoneVideo"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <!-- ========================= -->
  <!-- COMPUTER -->
  <!-- ========================= -->

  <div id="pcBox" class="box hidden">

    <h2>💻 Computer</h2>

    <input
      id="codeInput"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="6-digit code"
    >

    <button onclick="connectToPhone()">
      Connect
    </button>

    <div id="pcStatus" class="status">
      Enter the phone's code.
    </div>

    <video
      id="pcVideo"
      autoplay
      playsinline>
    </video>

  </div>


<script>

////////////////////////////////////////////////////
// GLOBAL VARIABLES
////////////////////////////////////////////////////

let phonePeer = null;
let phoneStream = null;

let pcPeer = null;
let pcConnection = null;

let phoneConnection = null;


////////////////////////////////////////////////////
// MODE BUTTONS
////////////////////////////////////////////////////

function phoneMode() {

  document
    .getElementById("phoneBox")
    .classList
    .remove("hidden");

  document
    .getElementById("pcBox")
    .classList
    .add("hidden");
}


function pcMode() {

  document
    .getElementById("pcBox")
    .classList
    .remove("hidden");

  document
    .getElementById("phoneBox")
    .classList
    .add("hidden");
}


////////////////////////////////////////////////////
// GENERATE 6 DIGIT CODE
////////////////////////////////////////////////////

function generateCode() {

  return String(
    Math.floor(
      100000 + Math.random() * 900000
    )
  );

}


////////////////////////////////////////////////////
// PHONE
////////////////////////////////////////////////////

async function startPhone() {

  try {

    document
      .getElementById("phoneStatus")
      .textContent =
      "📷 Opening camera...";


    //////////////////////////////////////////////////
    // GET CAMERA
    //////////////////////////////////////////////////

    phoneStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    //////////////////////////////////////////////////
    // SHOW CAMERA ON PHONE
    //////////////////////////////////////////////////

    const video =
      document.getElementById("phoneVideo");

    video.srcObject = phoneStream;

    await video.play();


    document
      .getElementById("phoneStatus")
      .textContent =
      "🌐 Creating connection...";


    //////////////////////////////////////////////////
    // CREATE 6 DIGIT PEER
    //////////////////////////////////////////////////

    createPhonePeer();

  }

  catch (error) {

    console.error(error);

    document
      .getElementById("phoneStatus")
      .textContent =
      "❌ Camera error: " +
      error.message;

  }

}


////////////////////////////////////////////////////
// CREATE PHONE PEER
////////////////////////////////////////////////////

function createPhonePeer() {

  const code =
    generateCode();


  //////////////////////////////////////////////////
  // CREATE PEER WITH 6 DIGIT ID
  //////////////////////////////////////////////////

  phonePeer =
    new Peer(code);


  //////////////////////////////////////////////////
  // PEER READY
  //////////////////////////////////////////////////

  phonePeer.on("open", function(id) {

    document
      .getElementById("code")
      .textContent = id;


    document
      .getElementById("phoneStatus")
      .textContent =
      "🟢 Ready! Waiting for computer...";

  });


  //////////////////////////////////////////////////
  // COMPUTER CONNECTS
  //////////////////////////////////////////////////

  phonePeer.on("connection", function(connection) {

    console.log(
      "Computer found!"
    );


    phoneConnection =
      connection;


    document
      .getElementById("phoneStatus")
      .textContent =
      "🟡 Computer found...";


    connection.on("open", function() {

      console.log(
        "Signaling connection opened"
      );


      document
        .getElementById("phoneStatus")
        .textContent =
        "🟡 Sending camera...";


      startPhoneWebRTC(connection);

    });

  });


  //////////////////////////////////////////////////
  // ERROR
  //////////////////////////////////////////////////

  phonePeer.on("error", function(error) {

    console.error(
      "Phone Peer Error:",
      error
    );


    if (
      error.type ===
      "unavailable-id"
    ) {

      phonePeer.destroy();

      createPhonePeer();

      return;

    }


    document
      .getElementById("phoneStatus")
      .textContent =
      "❌ " + error.type;

  });

}


////////////////////////////////////////////////////
// PHONE WEBRTC
////////////////////////////////////////////////////

async function startPhoneWebRTC(connection) {

  //////////////////////////////////////////////////
  // CREATE WEBRTC CONNECTION
  //////////////////////////////////////////////////

  const rtc =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
          "stun:stun.l.google.com:19302"
        }

      ]

    });


  //////////////////////////////////////////////////
  // ADD PHONE CAMERA
  //////////////////////////////////////////////////

  phoneStream
    .getTracks()
    .forEach(function(track) {

      rtc.addTrack(
        track,
        phoneStream
      );

    });


  //////////////////////////////////////////////////
  // CREATE OFFER
  //////////////////////////////////////////////////

  const offer =
    await rtc.createOffer();


  await rtc.setLocalDescription(
    offer
  );


  //////////////////////////////////////////////////
  // WAIT FOR ICE
  //////////////////////////////////////////////////

  await waitForICE(rtc);


  //////////////////////////////////////////////////
  // SEND OFFER TO PC
  //////////////////////////////////////////////////

  connection.send({

    type: "OFFER",

    sdp:
      rtc.localDescription

  });


  console.log(
    "Offer sent"
  );


  document
    .getElementById("phoneStatus")
    .textContent =
    "🟡 Waiting for PC answer...";


  //////////////////////////////////////////////////
  // RECEIVE ANSWER
  //////////////////////////////////////////////////

  connection.on("data", async function(message) {

    if (
      message.type ===
      "ANSWER"
    ) {

      console.log(
        "Answer received"
      );


      await rtc.setRemoteDescription(

        new RTCSessionDescription(
          message.sdp
        )

      );


      document
        .getElementById("phoneStatus")
        .textContent =
        "🟢 LIVE! Camera is being sent to PC.";

    }

  });

}


////////////////////////////////////////////////////
// WAIT FOR ICE
////////////////////////////////////////////////////

function waitForICE(rtc) {

  return new Promise(function(resolve) {

    if (
      rtc.iceGatheringState ===
      "complete"
    ) {

      resolve();

      return;

    }


    function checkICE() {

      if (
        rtc.iceGatheringState ===
        "complete"
      ) {

        rtc.removeEventListener(
          "icegatheringstatechange",
          checkICE
        );

        resolve();

      }

    }


    rtc.addEventListener(
      "icegatheringstatechange",
      checkICE
    );

  });

}


////////////////////////////////////////////////////
// COMPUTER
////////////////////////////////////////////////////

function connectToPhone() {

  const code =
    document
      .getElementById("codeInput")
      .value
      .trim();


  //////////////////////////////////////////////////
  // CHECK CODE
  //////////////////////////////////////////////////

  if (
    !/^\d{6}$/.test(code)
  ) {

    document
      .getElementById("pcStatus")
      .textContent =
      "⚠️ Enter exactly 6 digits.";

    return;

  }


  document
    .getElementById("pcStatus")
    .textContent =
    "🌐 Finding phone...";


  //////////////////////////////////////////////////
  // CREATE PC PEER
  //////////////////////////////////////////////////

  if (pcPeer) {

    pcPeer.destroy();

  }


  pcPeer =
    new Peer();


  //////////////////////////////////////////////////
  // PC PEER READY
  //////////////////////////////////////////////////

  pcPeer.on("open", function() {

    console.log(
      "PC Peer ready"
    );


    //////////////////////////////////////////////////
    // CONNECT TO PHONE'S 6 DIGIT ID
    //////////////////////////////////////////////////

    pcConnection =
      pcPeer.connect(code);


    //////////////////////////////////////////////////
    // CONNECTION OPEN
    //////////////////////////////////////////////////

    pcConnection.on(
      "open",
      function() {

        console.log(
          "Connected to phone!"
        );


        document
          .getElementById("pcStatus")
          .textContent =
          "🟢 Phone found! Waiting for video...";

      }
    );


    //////////////////////////////////////////////////
    // RECEIVE PHONE OFFER
    //////////////////////////////////////////////////

    pcConnection.on(
      "data",
      async function(message) {

        console.log(
          "Received:",
          message.type
        );


        if (
          message.type ===
          "OFFER"
        ) {

          await receivePhoneOffer(
            pcConnection,
            message.sdp
          );

        }

      }
    );


    //////////////////////////////////////////////////
    // CONNECTION ERROR
    //////////////////////////////////////////////////

    pcConnection.on(
      "error",
      function(error) {

        console.error(error);

        document
          .getElementById("pcStatus")
          .textContent =
          "❌ Connection error.";

      }
    );

  });


  //////////////////////////////////////////////////
  // PEER ERROR
  //////////////////////////////////////////////////

  pcPeer.on("error", function(error) {

    console.error(
      "PC Peer Error:",
      error
    );


    if (
      error.type ===
      "peer-unavailable"
    ) {

      document
        .getElementById("pcStatus")
        .textContent =
        "❌ Phone code not found.";

    }

    else {

      document
        .getElementById("pcStatus")
        .textContent =
        "❌ " + error.type;

    }

  });

}


////////////////////////////////////////////////////
// RECEIVE PHONE OFFER
////////////////////////////////////////////////////

async function receivePhoneOffer(
  connection,
  offer
) {

  console.log(
    "📡 Phone offer received"
  );


  //////////////////////////////////////////////////
  // CREATE WEBRTC
  //////////////////////////////////////////////////

  const rtc =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
          "stun:stun.l.google.com:19302"
        }

      ]

    });


  //////////////////////////////////////////////////
  // PC ONLY RECEIVES VIDEO
  //////////////////////////////////////////////////

  rtc.addTransceiver(
    "video",
    {
      direction: "recvonly"
    }
  );


  //////////////////////////////////////////////////
  // VIDEO ARRIVES
  //////////////////////////////////////////////////

  rtc.ontrack =
    function(event) {

      console.log(
        "🔥 VIDEO RECEIVED!"
      );


      const video =
        document
          .getElementById("pcVideo");


      if (
        event.streams &&
        event.streams[0]
      ) {

        video.srcObject =
          event.streams[0];

      }

      else {

        const stream =
          new MediaStream();


        stream.addTrack(
          event.track
        );


        video.srcObject =
          stream;

      }


      video.play()
        .then(function() {

          document
            .getElementById("pcStatus")
            .textContent =
            "🟢 LIVE! Phone camera connected.";

        })
        .catch(function(error) {

          console.error(
            "Video play error:",
            error
          );

        });

    };


  //////////////////////////////////////////////////
  // SET PHONE OFFER
  //////////////////////////////////////////////////

  await rtc.setRemoteDescription(

    new RTCSessionDescription(
      offer
    )

  );


  //////////////////////////////////////////////////
  // CREATE ANSWER
  //////////////////////////////////////////////////

  const answer =
    await rtc.createAnswer();


  await rtc.setLocalDescription(
    answer
  );


  //////////////////////////////////////////////////
  // WAIT FOR ICE
  //////////////////////////////////////////////////

  await waitForICE(rtc);


  //////////////////////////////////////////////////
  // SEND ANSWER TO PHONE
  //////////////////////////////////////////////////

  connection.send({

    type: "ANSWER",

    sdp:
      rtc.localDescription

  });


  document
    .getElementById("pcStatus")
    .textContent =
    "🟡 WebRTC connection created...";

}

</script>

</body>
</html>
