<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phone Camera → PC</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101218;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    .box {
      max-width: 800px;
      margin: 20px auto;
      padding: 25px;
      background: #1b1e26;
      border-radius: 18px;
    }

    button,
    input {
      padding: 14px 18px;
      margin: 6px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    input {
      width: 180px;
      text-align: center;
      letter-spacing: 4px;
    }

    video {
      width: 100%;
      max-height: 70vh;
      margin-top: 20px;
      background: black;
      border-radius: 15px;
    }

    #code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 25px;
    }

    .status {
      margin: 15px;
      color: #bbb;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h1>📱 Phone Camera → 💻 PC</h1>

  <div class="box">
    <button onclick="showPhone()">📱 PHONE</button>
    <button onclick="showPC()">💻 COMPUTER</button>
  </div>


  <!-- PHONE -->

  <div id="phoneBox" class="box hidden">

    <h2>📱 Phone</h2>

    <button onclick="startPhone()">
      Start Camera
    </button>

    <div id="code">------</div>

    <p>Enter this code on the computer.</p>

    <div id="phoneStatus" class="status">
      Camera not started.
    </div>

    <video
      id="phoneVideo"
      autoplay
      muted
      playsinline>
    </video>

  </div>


  <!-- COMPUTER -->

  <div id="pcBox" class="box hidden">

    <h2>💻 Computer</h2>

    <input
      id="codeInput"
      type="text"
      maxlength="6"
      inputmode="numeric"
      placeholder="6-digit code">

    <button onclick="connectPC()">
      Connect
    </button>

    <div id="pcStatus" class="status">
      Enter the phone code.
    </div>

    <video
      id="pcVideo"
      autoplay
      playsinline>
    </video>

  </div>


<script>

let phonePeer = null;
let phoneStream = null;

let pcPeer = null;


/* =========================
   MODE
========================= */

function showPhone() {

  document.getElementById("phoneBox")
    .classList.remove("hidden");

  document.getElementById("pcBox")
    .classList.add("hidden");
}


function showPC() {

  document.getElementById("pcBox")
    .classList.remove("hidden");

  document.getElementById("phoneBox")
    .classList.add("hidden");
}


/* =========================
   RANDOM 6 DIGIT CODE
========================= */

function makeCode() {

  return String(
    Math.floor(
      100000 + Math.random() * 900000
    )
  );

}


/* =========================
   PHONE
========================= */

async function startPhone() {

  const status =
    document.getElementById("phoneStatus");

  try {

    status.textContent =
      "📷 Opening camera...";


    /* CAMERA */

    phoneStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    /* SHOW PHONE CAMERA */

    const video =
      document.getElementById("phoneVideo");

    video.srcObject =
      phoneStream;

    await video.play();


    status.textContent =
      "🌐 Connecting...";


    createPhonePeer();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   CREATE PHONE PEER
========================= */

function createPhonePeer() {

  const status =
    document.getElementById("phoneStatus");


  const code =
    makeCode();


  console.log(
    "Phone code:",
    code
  );


  phonePeer =
    new Peer(code, {

      host: "0.peerjs.com",

      port: 443,

      secure: true,

      path: "/"

    });


  /* PEER READY */

  phonePeer.on("open", function(id) {

    console.log(
      "PHONE READY:",
      id
    );


    document.getElementById("code")
      .textContent = id;


    status.textContent =
      "🟢 Ready! Waiting for PC...";

  });


  /* PC CALLS PHONE */

  phonePeer.on("call", function(call) {

    console.log(
      "📞 PC called phone"
    );


    status.textContent =
      "🟡 PC connected! Sending camera...";


    /* ANSWER WITH CAMERA */

    call.answer(phoneStream);


    /* OPTIONAL EVENTS */

    call.on("close", function() {

      status.textContent =
        "🔴 PC disconnected.";

    });


    call.on("error", function(error) {

      console.error(
        "Call error:",
        error
      );

      status.textContent =
        "❌ Video error.";

    });

  });


  /* ERROR */

  phonePeer.on("error", function(error) {

    console.error(
      "PHONE PEER ERROR:",
      error
    );


    if (error.type === "unavailable-id") {

      status.textContent =
        "🔄 Code collision. Creating new code...";


      phonePeer.destroy();

      setTimeout(
        createPhonePeer,
        500
      );

      return;

    }


    status.textContent =
      "❌ " + error.type;

  });


  phonePeer.on("disconnected", function() {

    status.textContent =
      "🔴 Connection server disconnected.";

  });

}


/* =========================
   COMPUTER
========================= */

function connectPC() {

  const status =
    document.getElementById("pcStatus");


  const code =
    document.getElementById("codeInput")
      .value
      .trim();


  /* CHECK CODE */

  if (!/^\d{6}$/.test(code)) {

    status.textContent =
      "⚠️ Enter exactly 6 digits.";

    return;

  }


  status.textContent =
    "🌐 Connecting to phone...";


  /* DESTROY OLD PEER */

  if (pcPeer) {

    pcPeer.destroy();

  }


  /* CREATE PC PEER */

  pcPeer =
    new Peer(undefined, {

      host: "0.peerjs.com",

      port: 443,

      secure: true,

      path: "/"

    });


  /* PC READY */

  pcPeer.on("open", function(id) {

    console.log(
      "PC READY:",
      id
    );


    status.textContent =
      "📞 Calling phone...";


    /*
      IMPORTANT:

      We need a MediaStream because
      PeerJS call() expects one.

      We don't want to send PC camera,
      so create an empty stream.
    */

    const emptyStream =
      new MediaStream();


    /* CALL PHONE */

    const call =
      pcPeer.call(
        code,
        emptyStream
      );


    if (!call) {

      status.textContent =
        "❌ Could not create call.";

      return;

    }


    status.textContent =
      "🟡 Waiting for phone video...";


    /* RECEIVE PHONE CAMERA */

    call.on("stream", function(stream) {

      console.log(
        "🔥 PHONE VIDEO RECEIVED"
      );


      const video =
        document.getElementById("pcVideo");


      video.srcObject =
        stream;


      video.play()
        .then(function() {

          status.textContent =
            "🟢 LIVE! Phone camera connected.";

        })
        .catch(function(error) {

          console.error(
            "Video play error:",
            error
          );

        });

    });


    /* CALL CLOSED */

    call.on("close", function() {

      status.textContent =
        "🔴 Phone disconnected.";

    });


    /* CALL ERROR */

    call.on("error", function(error) {

      console.error(
        "CALL ERROR:",
        error
      );

      status.textContent =
        "❌ Video connection failed.";

    });

  });


  /* PHONE NOT FOUND */

  pcPeer.on("error", function(error) {

    console.error(
      "PC PEER ERROR:",
      error
    );


    if (error.type === "peer-unavailable") {

      status.textContent =
        "❌ Phone not found. Check the code.";

    }

    else {

      status.textContent =
        "❌ " + error.type;

    }

  });

}


/* =========================
   CLEAN UP
========================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (phoneStream) {

      phoneStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }

    if (phonePeer) {

      phonePeer.destroy();

    }

    if (pcPeer) {

      pcPeer.destroy();

    }

  }
);

</script>

</body>
</html>
