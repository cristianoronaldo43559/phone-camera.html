<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phone Camera → PC</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: #191b21;
      border-radius: 18px;
    }

    button,
    input {
      font-size: 18px;
      padding: 12px 16px;
      margin: 6px;
      border: none;
      border-radius: 10px;
    }

    button {
      cursor: pointer;
    }

    input {
      width: 190px;
      text-align: center;
    }

    video {
      width: 100%;
      max-height: 65vh;
      background: black;
      border-radius: 14px;
      margin-top: 15px;
    }

    #code {
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 7px;
      margin: 20px;
    }

    .hidden {
      display: none;
    }

    .status {
      margin: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h1>📱 Phone Camera → 💻 PC</h1>

  <!-- MODE BUTTONS -->
  <div class="box">
    <button onclick="showPhone()">📱 Phone</button>
    <button onclick="showPC()">💻 Computer</button>
  </div>


  <!-- ================= PHONE ================= -->

  <div id="phone" class="box hidden">

    <h2>📱 Phone Camera</h2>

    <button onclick="startPhone()">
      Start Camera
    </button>

    <div id="code">
      ------
    </div>

    <p>
      Enter this 6-digit code on the computer.
    </p>

    <div id="phoneStatus" class="status">
      Waiting...
    </div>

    <video
      id="localVideo"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <!-- ================= COMPUTER ================= -->

  <div id="pc" class="box hidden">

    <h2>💻 Computer Viewer</h2>

    <input
      id="codeInput"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="6-digit code">

    <button onclick="connectPC()">
      Connect
    </button>

    <div id="pcStatus" class="status">
      Enter the phone code.
    </div>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>


  <script>

    let peer = null;
    let stream = null;


    // =========================
    // SWITCH TO PHONE MODE
    // =========================

    function showPhone() {

      document
        .getElementById("phone")
        .classList
        .remove("hidden");

      document
        .getElementById("pc")
        .classList
        .add("hidden");
    }


    // =========================
    // SWITCH TO PC MODE
    // =========================

    function showPC() {

      document
        .getElementById("pc")
        .classList
        .remove("hidden");

      document
        .getElementById("phone")
        .classList
        .add("hidden");
    }


    // =========================
    // GENERATE 6 DIGIT CODE
    // =========================

    function randomCode() {

      return String(
        Math.floor(
          100000 + Math.random() * 900000
        )
      );

    }


    // =========================
    // START PHONE CAMERA
    // =========================

    async function startPhone() {

      try {

        // Open phone camera
        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        // Show camera on phone
        document
          .getElementById("localVideo")
          .srcObject = stream;


        document
          .getElementById("phoneStatus")
          .textContent =
          "Creating your code...";


        createPhonePeer();

      }

      catch (error) {

        document
          .getElementById("phoneStatus")
          .textContent =
          "Camera error: " + error.message;

      }

    }


    // =========================
    // CREATE PHONE CONNECTION
    // =========================

    function createPhonePeer() {

      const code = randomCode();


      // Create PeerJS connection
      peer = new Peer(code);


      // Peer successfully connected
      peer.on("open", function(id) {

        document
          .getElementById("code")
          .textContent = id;


        document
          .getElementById("phoneStatus")
          .textContent =
          "🟢 Waiting for computer...";

      });


      // Computer calls phone
      peer.on("call", function(call) {

        // Send phone camera to computer
        call.answer(stream);


        call.on("close", function() {

          document
            .getElementById("phoneStatus")
            .textContent =
            "Connection closed.";

        });


        document
          .getElementById("phoneStatus")
          .textContent =
          "🟢 Computer connected!";

      });


      // Handle errors
      peer.on("error", function(error) {

        console.log(error);


        // If code already exists,
        // generate another one.
        if (error.type === "unavailable-id") {

          peer.destroy();

          createPhonePeer();

        }

        else {

          document
            .getElementById("phoneStatus")
            .textContent =
            "Connection error: " + error.type;

        }

      });

    }


    // =========================
    // CONNECT COMPUTER
    // =========================

    function connectPC() {

      const code =
        document
          .getElementById("codeInput")
          .value
          .trim();


      // Check code
      if (!/^\d{6}$/.test(code)) {

        document
          .getElementById("pcStatus")
          .textContent =
          "⚠️ Enter exactly 6 digits.";

        return;

      }


      document
        .getElementById("pcStatus")
        .textContent =
        "Connecting...";


      // Destroy old connection
      if (peer) {

        peer.destroy();

      }


      // Create computer Peer
      peer = new Peer();


      peer.on("open", function() {

        /*
          PeerJS normally expects the caller
          to provide a MediaStream.

          We don't want to use the PC camera,
          so create a tiny dummy stream.
        */

        const canvas =
          document.createElement("canvas");

        canvas.width = 2;
        canvas.height = 2;


        const dummyStream =
          canvas.captureStream(1);


        // Call the phone
        const call =
          peer.call(code, dummyStream);


        // Receive phone camera
        call.on("stream", function(remoteStream) {

          document
            .getElementById("remoteVideo")
            .srcObject = remoteStream;


          document
            .getElementById("pcStatus")
            .textContent =
            "🟢 Connected! Live phone camera.";

        });


        call.on("close", function() {

          document
            .getElementById("pcStatus")
            .textContent =
            "Connection closed.";

        });


        call.on("error", function(error) {

          document
            .getElementById("pcStatus")
            .textContent =
            "Call error: " + error.message;

        });

      });


      // Computer connection error
      peer.on("error", function(error) {

        console.log(error);


        document
          .getElementById("pcStatus")
          .textContent =
          "❌ Error: " + error.type;

      });

    }

  </script>

</body>
</html>
