<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Camera → PC</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: #191b21;
      border-radius: 18px;
    }

    button,
    input {
      font-size: 18px;
      padding: 12px 16px;
      margin: 6px;
      border: none;
      border-radius: 10px;
    }

    button {
      cursor: pointer;
    }

    input {
      width: 190px;
      text-align: center;
    }

    video {
      width: 100%;
      max-height: 65vh;
      background: black;
      border-radius: 14px;
      margin-top: 15px;
    }

    #code {
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 7px;
      margin: 20px;
    }

    .hidden {
      display: none;
    }

    .status {
      margin: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h1>📱 Phone Camera → 💻 PC</h1>

  <div class="box">
    <button onclick="showPhone()">📱 Phone</button>
    <button onclick="showPC()">💻 Computer</button>
  </div>


  <!-- PHONE -->

  <div id="phone" class="box hidden">

    <h2>📱 Phone Camera</h2>

    <button onclick="startPhone()">
      Start Camera
    </button>

    <div id="code">------</div>

    <p>Enter this code on the computer.</p>

    <div id="phoneStatus" class="status">
      Waiting...
    </div>

    <video
      id="localVideo"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <!-- COMPUTER -->

  <div id="pc" class="box hidden">

    <h2>💻 Computer Viewer</h2>

    <input
      id="codeInput"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="6-digit code">

    <button onclick="connectPC()">
      Connect
    </button>

    <div id="pcStatus" class="status">
      Enter the phone code.
    </div>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>


  <script>

    let phonePeer = null;
    let phoneStream = null;

    let pcPeer = null;


    // =========================
    // PHONE MODE
    // =========================

    function showPhone() {

      document.getElementById("phone")
        .classList.remove("hidden");

      document.getElementById("pc")
        .classList.add("hidden");
    }


    // =========================
    // PC MODE
    // =========================

    function showPC() {

      document.getElementById("pc")
        .classList.remove("hidden");

      document.getElementById("phone")
        .classList.add("hidden");
    }


    // =========================
    // RANDOM 6 DIGIT CODE
    // =========================

    function generateCode() {

      return String(
        Math.floor(
          100000 + Math.random() * 900000
        )
      );

    }


    // =========================
    // START PHONE CAMERA
    // =========================

    async function startPhone() {

      try {

        document.getElementById("phoneStatus")
          .textContent = "Opening camera...";


        phoneStream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        // Show camera on phone

        const video =
          document.getElementById("localVideo");

        video.srcObject = phoneStream;

        await video.play();


        document.getElementById("phoneStatus")
          .textContent = "Creating connection...";


        createPhonePeer();

      }

      catch (error) {

        console.error(error);

        document.getElementById("phoneStatus")
          .textContent =
          "❌ Camera error: " + error.message;

      }

    }


    // =========================
    // CREATE PHONE PEER
    // =========================

    function createPhonePeer() {

      const code = generateCode();


      phonePeer = new Peer(code);


      // Peer connected to PeerJS

      phonePeer.on("open", function(id) {

        document.getElementById("code")
          .textContent = id;

        document.getElementById("phoneStatus")
          .textContent =
          "🟢 Ready! Enter the code on your PC.";

      });


      // PC is calling the phone

      phonePeer.on("call", function(call) {

        console.log("PC called phone");


        // IMPORTANT:
        // Send the REAL phone camera stream

        call.answer(phoneStream);


        document.getElementById("phoneStatus")
          .textContent =
          "🟢 PC connected! Sending camera...";


        call.on("close", function() {

          document.getElementById("phoneStatus")
            .textContent =
            "PC disconnected.";

        });

      });


      // Error

      phonePeer.on("error", function(error) {

        console.error("Phone Peer Error:", error);


        if (error.type === "unavailable-id") {

          phonePeer.destroy();

          createPhonePeer();

        }
        else {

          document.getElementById("phoneStatus")
            .textContent =
            "❌ " + error.type;

        }

      });

    }


    // =========================
    // COMPUTER CONNECT
    // =========================

    function connectPC() {

      const code =
        document.getElementById("codeInput")
          .value
          .trim();


      if (!/^\d{6}$/.test(code)) {

        document.getElementById("pcStatus")
          .textContent =
          "⚠️ Enter exactly 6 digits.";

        return;

      }


      document.getElementById("pcStatus")
        .textContent =
        "Connecting to phone...";


      if (pcPeer) {

        pcPeer.destroy();

      }


      /*
        IMPORTANT FIX:

        The PC doesn't need its camera.

        We create a Peer and use a WebRTC
        connection that only receives the
        phone's stream.
      */

      pcPeer = new Peer();


      pcPeer.on("open", function() {

        console.log("PC Peer ready");


        const connection =
          pcPeer.call(code, null);


        connection.on("stream", function(remoteStream) {

          console.log("PHONE STREAM RECEIVED");


          const video =
            document.getElementById("remoteVideo");


          video.srcObject = remoteStream;


          video.play()
            .then(function() {

              document.getElementById("pcStatus")
                .textContent =
                "🟢 LIVE! Phone camera received.";

            })
            .catch(function(error) {

              console.error("Video play error:", error);

              document.getElementById("pcStatus")
                .textContent =
                "Stream received — click the video to play.";

            });

        });


        connection.on("close", function() {

          document.getElementById("pcStatus")
            .textContent =
            "Phone disconnected.";

        });


        connection.on("error", function(error) {

          console.error(error);

          document.getElementById("pcStatus")
            .textContent =
            "❌ Call error.";

        });

      });


      pcPeer.on("error", function(error) {

        console.error("PC Peer Error:", error);

        document.getElementById("pcStatus")
          .textContent =
          "❌ " + error.type;

      });

    }

  </script>

</body>
</html>
