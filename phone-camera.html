<script>

////////////////////////////////////////////////////
// GLOBAL VARIABLES
////////////////////////////////////////////////////

let phonePeer = null;
let phoneStream = null;

let pcPeer = null;
let pcConnection = null;

let phoneConnection = null;


////////////////////////////////////////////////////
// PEERJS CONFIG
////////////////////////////////////////////////////

const PEER_CONFIG = {
  host: "0.peerjs.com",
  port: 443,
  secure: true,
  path: "/"
};


////////////////////////////////////////////////////
// MODE BUTTONS
////////////////////////////////////////////////////

function phoneMode() {

  document.getElementById("phoneBox")
    .classList.remove("hidden");

  document.getElementById("pcBox")
    .classList.add("hidden");
}


function pcMode() {

  document.getElementById("pcBox")
    .classList.remove("hidden");

  document.getElementById("phoneBox")
    .classList.add("hidden");
}


////////////////////////////////////////////////////
// GENERATE 6 DIGIT CODE
////////////////////////////////////////////////////

function generateCode() {

  return String(
    Math.floor(100000 + Math.random() * 900000)
  );

}


////////////////////////////////////////////////////
// PHONE
////////////////////////////////////////////////////

async function startPhone() {

  try {

    document.getElementById("phoneStatus")
      .textContent = "📷 Opening camera...";


    //////////////////////////////////////////////////
    // CAMERA
    //////////////////////////////////////////////////

    phoneStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    //////////////////////////////////////////////////
    // SHOW PHONE CAMERA
    //////////////////////////////////////////////////

    const video =
      document.getElementById("phoneVideo");

    video.srcObject = phoneStream;

    await video.play();


    document.getElementById("phoneStatus")
      .textContent = "🌐 Connecting to PeerJS...";


    //////////////////////////////////////////////////
    // CREATE PEER
    //////////////////////////////////////////////////

    createPhonePeer();

  }

  catch (error) {

    console.error(error);

    document.getElementById("phoneStatus")
      .textContent =
      "❌ Camera error: " + error.message;

  }

}


////////////////////////////////////////////////////
// CREATE PHONE PEER
////////////////////////////////////////////////////

function createPhonePeer() {

  const code = generateCode();

  console.log("Creating phone Peer:", code);


  phonePeer =
    new Peer(code, PEER_CONFIG);


  //////////////////////////////////////////////////
  // PEER OPEN
  //////////////////////////////////////////////////

  phonePeer.on("open", function(id) {

    console.log("PHONE PEER READY:", id);

    document.getElementById("code")
      .textContent = id;

    document.getElementById("phoneStatus")
      .textContent =
      "🟢 Ready! Enter this code on PC.";

  });


  //////////////////////////////////////////////////
  // COMPUTER CONNECTS
  //////////////////////////////////////////////////

  phonePeer.on("connection", function(connection) {

    console.log("💻 Computer connection received");

    phoneConnection = connection;


    document.getElementById("phoneStatus")
      .textContent =
      "🟡 Computer found! Connecting...";


    //////////////////////////////////////////////////
    // IMPORTANT:
    // LISTEN FOR DATA BEFORE STARTING WEBRTC
    //////////////////////////////////////////////////

    connection.on("data", async function(message) {

      console.log(
        "📡 PHONE RECEIVED:",
        message.type
      );


      if (message.type === "ANSWER") {

        console.log("✅ PC ANSWER RECEIVED");

        await phoneRTC.setRemoteDescription(
          new RTCSessionDescription(message.sdp)
        );

        document.getElementById("phoneStatus")
          .textContent =
          "🟢 LIVE! Camera is being sent to PC.";

      }

    });


    //////////////////////////////////////////////////
    // CONNECTION OPEN
    //////////////////////////////////////////////////

    connection.on("open", function() {

      console.log("🟢 DATA CONNECTION OPEN");

      document.getElementById("phoneStatus")
        .textContent =
        "🟡 Starting video connection...";


      startPhoneWebRTC(connection);

    });


    //////////////////////////////////////////////////
    // CONNECTION ERROR
    //////////////////////////////////////////////////

    connection.on("error", function(error) {

      console.error(
        "Phone data connection error:",
        error
      );

      document.getElementById("phoneStatus")
        .textContent =
        "❌ Data connection error.";

    });

  });


  //////////////////////////////////////////////////
  // PEER ERROR
  //////////////////////////////////////////////////

  phonePeer.on("error", function(error) {

    console.error(
      "PHONE PEER ERROR:",
      error
    );


    if (error.type === "unavailable-id") {

      console.log("Code collision. Generating new code...");

      phonePeer.destroy();

      createPhonePeer();

      return;

    }


    document.getElementById("phoneStatus")
      .textContent =
      "❌ PeerJS: " + error.type;

  });


  //////////////////////////////////////////////////
  // DISCONNECTED
  //////////////////////////////////////////////////

  phonePeer.on("disconnected", function() {

    console.log("Phone PeerJS disconnected");

    document.getElementById("phoneStatus")
      .textContent =
      "🔴 PeerJS disconnected.";

  });

}


////////////////////////////////////////////////////
// PHONE WEBRTC
////////////////////////////////////////////////////

let phoneRTC = null;


async function startPhoneWebRTC(connection) {

  console.log("📹 Creating phone WebRTC");


  //////////////////////////////////////////////////
  // CREATE RTC
  //////////////////////////////////////////////////

  phoneRTC =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    });


  //////////////////////////////////////////////////
  // ADD CAMERA TRACKS
  //////////////////////////////////////////////////

  phoneStream
    .getTracks()
    .forEach(function(track) {

      phoneRTC.addTrack(
        track,
        phoneStream
      );

    });


  //////////////////////////////////////////////////
  // RTC STATUS
  //////////////////////////////////////////////////

  phoneRTC.onconnectionstatechange =
    function() {

      console.log(
        "PHONE RTC:",
        phoneRTC.connectionState
      );

    };


  //////////////////////////////////////////////////
  // CREATE OFFER
  //////////////////////////////////////////////////

  const offer =
    await phoneRTC.createOffer();


  await phoneRTC.setLocalDescription(
    offer
  );


  //////////////////////////////////////////////////
  // WAIT FOR ICE
  //////////////////////////////////////////////////

  await waitForICE(phoneRTC);


  //////////////////////////////////////////////////
  // SEND OFFER
  //////////////////////////////////////////////////

  console.log("📡 Sending OFFER");

  connection.send({

    type: "OFFER",

    sdp: phoneRTC.localDescription

  });


  document.getElementById("phoneStatus")
    .textContent =
    "🟡 Waiting for PC...";

}


////////////////////////////////////////////////////
// WAIT FOR ICE
////////////////////////////////////////////////////

function waitForICE(rtc) {

  return new Promise(function(resolve) {

    if (
      rtc.iceGatheringState === "complete"
    ) {

      resolve();

      return;

    }


    function checkICE() {

      if (
        rtc.iceGatheringState === "complete"
      ) {

        rtc.removeEventListener(
          "icegatheringstatechange",
          checkICE
        );

        resolve();

      }

    }


    rtc.addEventListener(
      "icegatheringstatechange",
      checkICE
    );

  });

}


////////////////////////////////////////////////////
// COMPUTER
////////////////////////////////////////////////////

function connectToPhone() {

  const code =
    document.getElementById("codeInput")
      .value
      .trim();


  //////////////////////////////////////////////////
  // CHECK CODE
  //////////////////////////////////////////////////

  if (!/^\d{6}$/.test(code)) {

    document.getElementById("pcStatus")
      .textContent =
      "⚠️ Enter exactly 6 digits.";

    return;

  }


  document.getElementById("pcStatus")
    .textContent =
    "🌐 Connecting to PeerJS...";


  //////////////////////////////////////////////////
  // DESTROY OLD PEER
  //////////////////////////////////////////////////

  if (pcPeer) {

    try {
      pcPeer.destroy();
    } catch (e) {}

  }


  //////////////////////////////////////////////////
  // CREATE PC PEER
  //////////////////////////////////////////////////

  pcPeer =
    new Peer(undefined, PEER_CONFIG);


  //////////////////////////////////////////////////
  // PC PEER READY
  //////////////////////////////////////////////////

  pcPeer.on("open", function(myId) {

    console.log(
      "💻 PC PEER READY:",
      myId
    );


    document.getElementById("pcStatus")
      .textContent =
      "🌐 Finding phone...";


    //////////////////////////////////////////////////
    // CONNECT TO PHONE
    //////////////////////////////////////////////////

    pcConnection =
      pcPeer.connect(code, {

        reliable: true

      });


    //////////////////////////////////////////////////
    // CONNECTION OPEN
    //////////////////////////////////////////////////

    pcConnection.on("open", function() {

      console.log(
        "🟢 PC CONNECTED TO PHONE"
      );


      document.getElementById("pcStatus")
        .textContent =
        "🟢 Phone found! Waiting for video...";

    });


    //////////////////////////////////////////////////
    // RECEIVE OFFER
    //////////////////////////////////////////////////

    pcConnection.on("data", async function(message) {

      console.log(
        "📡 PC RECEIVED:",
        message.type
      );


      if (message.type === "OFFER") {

        document.getElementById("pcStatus")
          .textContent =
          "📡 Phone camera found! Starting video...";


        await receivePhoneOffer(
          pcConnection,
          message.sdp
        );

      }

    });


    //////////////////////////////////////////////////
    // DATA ERROR
    //////////////////////////////////////////////////

    pcConnection.on("error", function(error) {

      console.error(
        "PC DATA ERROR:",
        error
      );

      document.getElementById("pcStatus")
        .textContent =
        "❌ Connection error.";

    });


    //////////////////////////////////////////////////
    // CLOSE
    //////////////////////////////////////////////////

    pcConnection.on("close", function() {

      console.log("Connection closed");

      document.getElementById("pcStatus")
        .textContent =
        "🔴 Phone disconnected.";

    });

  });


  //////////////////////////////////////////////////
  // PEER ERROR
  //////////////////////////////////////////////////

  pcPeer.on("error", function(error) {

    console.error(
      "PC PEER ERROR:",
      error
    );


    if (error.type === "peer-unavailable") {

      document.getElementById("pcStatus")
        .textContent =
        "❌ Phone code not found.";

    }

    else {

      document.getElementById("pcStatus")
        .textContent =
        "❌ PeerJS: " + error.type;

    }

  });


  //////////////////////////////////////////////////
  // DISCONNECTED
  //////////////////////////////////////////////////

  pcPeer.on("disconnected", function() {

    console.log("PC PeerJS disconnected");

    document.getElementById("pcStatus")
      .textContent =
      "🔴 PeerJS disconnected.";

  });

}


////////////////////////////////////////////////////
// RECEIVE PHONE OFFER
////////////////////////////////////////////////////

async function receivePhoneOffer(
  connection,
  offer
) {

  console.log(
    "📡 PHONE OFFER RECEIVED"
  );


  //////////////////////////////////////////////////
  // CREATE RTC
  //////////////////////////////////////////////////

  const rtc =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    });


  //////////////////////////////////////////////////
  // RECEIVE VIDEO ONLY
  //////////////////////////////////////////////////

  rtc.addTransceiver(
    "video",
    {
      direction: "recvonly"
    }
  );


  //////////////////////////////////////////////////
  // VIDEO ARRIVES
  //////////////////////////////////////////////////

  rtc.ontrack =
    function(event) {

      console.log(
        "🔥 VIDEO TRACK RECEIVED!"
      );


      const video =
        document.getElementById("pcVideo");


      if (
        event.streams &&
        event.streams[0]
      ) {

        video.srcObject =
          event.streams[0];

      }

      else {

        const stream =
          new MediaStream();

        stream.addTrack(
          event.track
        );

        video.srcObject =
          stream;

      }


      video.play()
        .then(function() {

          document.getElementById("pcStatus")
            .textContent =
            "🟢 LIVE! Phone camera connected.";

        })
        .catch(function(error) {

          console.error(
            "VIDEO PLAY ERROR:",
            error
          );

        });

    };


  //////////////////////////////////////////////////
  // RTC STATES
  //////////////////////////////////////////////////

  rtc.onconnectionstatechange =
    function() {

      console.log(
        "💻 PC RTC:",
        rtc.connectionState
      );

    };


  rtc.oniceconnectionstatechange =
    function() {

      console.log(
        "💻 ICE:",
        rtc.iceConnectionState
      );

    };


  //////////////////////////////////////////////////
  // SET OFFER
  //////////////////////////////////////////////////

  await rtc.setRemoteDescription(
    new RTCSessionDescription(offer)
  );


  //////////////////////////////////////////////////
  // CREATE ANSWER
  //////////////////////////////////////////////////

  const answer =
    await rtc.createAnswer();


  await rtc.setLocalDescription(
    answer
  );


  //////////////////////////////////////////////////
  // WAIT FOR ICE
  //////////////////////////////////////////////////

  await waitForICE(rtc);


  //////////////////////////////////////////////////
  // SEND ANSWER
  //////////////////////////////////////////////////

  console.log(
    "📡 Sending ANSWER"
  );


  connection.send({

    type: "ANSWER",

    sdp: rtc.localDescription

  });


  document.getElementById("pcStatus")
    .textContent =
    "🟡 WebRTC connecting...";

}

</script>
