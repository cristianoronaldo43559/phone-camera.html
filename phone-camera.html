<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phone Camera → PC</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101218;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin-bottom: 25px;
}

.box {
  max-width: 800px;
  margin: 20px auto;
  padding: 25px;
  background: #1b1e26;
  border-radius: 18px;
}

button,
input {
  padding: 14px 18px;
  margin: 6px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
}

button {
  cursor: pointer;
  font-weight: bold;
}

input {
  width: 190px;
  text-align: center;
  letter-spacing: 4px;
}

video {
  width: 100%;
  max-height: 70vh;
  margin-top: 20px;
  background: black;
  border-radius: 15px;
}

#code {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 8px;
  margin: 25px;
}

.status {
  margin: 15px;
  color: #bbb;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h1>📱 Phone Camera → 💻 PC</h1>

<div class="box">
  <button onclick="showPhone()">📱 PHONE</button>
  <button onclick="showPC()">💻 COMPUTER</button>
</div>


<!-- PHONE -->

<div id="phoneBox" class="box hidden">

  <h2>📱 Phone Camera</h2>

  <button onclick="startPhone()">
    Start Camera
  </button>

  <div id="code">------</div>

  <p>Enter this code on your computer.</p>

  <div id="phoneStatus" class="status">
    Camera not started.
  </div>

  <video
    id="phoneVideo"
    autoplay
    muted
    playsinline>
  </video>

</div>


<!-- PC -->

<div id="pcBox" class="box hidden">

  <h2>💻 Computer</h2>

  <input
    id="codeInput"
    type="text"
    inputmode="numeric"
    maxlength="6"
    placeholder="6-digit code">

  <button onclick="connectPC()">
    Connect
  </button>

  <div id="pcStatus" class="status">
    Enter the phone code.
  </div>

  <video
    id="pcVideo"
    autoplay
    playsinline>
  </video>

</div>


<script>

/* =================================================
   VARIABLES
================================================= */

let phonePeer = null;
let phoneStream = null;
let phoneDataConnection = null;
let phoneRTC = null;

let pcPeer = null;
let pcDataConnection = null;
let pcRTC = null;


/* =================================================
   PEERJS CONFIG
================================================= */

const peerConfig = {
  host: "0.peerjs.com",
  port: 443,
  secure: true,
  path: "/"
};


/* =================================================
   MODE
================================================= */

function showPhone() {

  document
    .getElementById("phoneBox")
    .classList.remove("hidden");

  document
    .getElementById("pcBox")
    .classList.add("hidden");
}


function showPC() {

  document
    .getElementById("pcBox")
    .classList.remove("hidden");

  document
    .getElementById("phoneBox")
    .classList.add("hidden");
}


/* =================================================
   CODE
================================================= */

function generateCode() {

  return String(
    Math.floor(
      100000 + Math.random() * 900000
    )
  );

}


/* =================================================
   PHONE START
================================================= */

async function startPhone() {

  const status =
    document.getElementById("phoneStatus");

  try {

    status.textContent =
      "📷 Opening camera...";


    /* GET CAMERA */

    phoneStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    /* SHOW CAMERA */

    const video =
      document.getElementById("phoneVideo");

    video.srcObject =
      phoneStream;

    await video.play();


    status.textContent =
      "🌐 Connecting...";


    createPhonePeer();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "❌ Camera error: " +
      error.message;

  }

}


/* =================================================
   PHONE PEER
================================================= */

function createPhonePeer() {

  const status =
    document.getElementById("phoneStatus");

  const code =
    generateCode();


  phonePeer =
    new Peer(
      code,
      peerConfig
    );


  /* PEER READY */

  phonePeer.on(
    "open",
    function(id) {

      console.log(
        "PHONE PEER:",
        id
      );


      document
        .getElementById("code")
        .textContent = id;


      status.textContent =
        "🟢 Ready! Waiting for PC...";

    }
  );


  /* PC CONNECTS */

  phonePeer.on(
    "connection",
    function(connection) {

      console.log(
        "💻 PC FOUND"
      );


      phoneDataConnection =
        connection;


      status.textContent =
        "🟡 PC found! Connecting...";


      connection.on(
        "open",
        function() {

          console.log(
            "🟢 DATA CONNECTION OPEN"
          );


          status.textContent =
            "🟡 Starting video...";


          startPhoneWebRTC(
            connection
          );

        }
      );


      connection.on(
        "error",
        function(error) {

          console.error(
            "DATA ERROR:",
            error
          );

          status.textContent =
            "❌ Data connection error.";

        }
      );

    }
  );


  /* PEER ERROR */

  phonePeer.on(
    "error",
    function(error) {

      console.error(
        "PHONE PEER ERROR:",
        error
      );


      if (
        error.type ===
        "unavailable-id"
      ) {

        phonePeer.destroy();

        status.textContent =
          "🔄 Creating new code...";

        setTimeout(
          createPhonePeer,
          500
        );

        return;
      }


      status.textContent =
        "❌ " + error.type;

    }
  );

}


/* =================================================
   PHONE WEBRTC
================================================= */

async function startPhoneWebRTC(
  connection
) {

  console.log(
    "📹 Creating WebRTC"
  );


  /* CREATE RTC */

  phoneRTC =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    });


  /* ADD CAMERA */

  phoneStream
    .getTracks()
    .forEach(function(track) {

      phoneRTC.addTrack(
        track,
        phoneStream
      );

    });


  /* RTC STATUS */

  phoneRTC.onconnectionstatechange =
    function() {

      console.log(
        "PHONE RTC:",
        phoneRTC.connectionState
      );

    };


  /* CREATE OFFER */

  const offer =
    await phoneRTC.createOffer();


  await phoneRTC.setLocalDescription(
    offer
  );


  /* SEND OFFER */

  connection.send({

    type: "OFFER",

    sdp:
      phoneRTC.localDescription

  });


  console.log(
    "📡 OFFER SENT"
  );


  document
    .getElementById("phoneStatus")
    .textContent =
    "🟡 Sending camera to PC...";


  /* RECEIVE ANSWER */

  connection.on(
    "data",
    async function(message) {

      console.log(
        "PHONE RECEIVED:",
        message
      );


      if (
        message &&
        message.type === "ANSWER"
      ) {

        console.log(
          "✅ ANSWER RECEIVED"
        );


        await phoneRTC.setRemoteDescription(
          message.sdp
        );


        document
          .getElementById("phoneStatus")
          .textContent =
          "🟢 LIVE! Camera connected.";

      }

    }
  );

}


/* =================================================
   PC CONNECT
================================================= */

function connectPC() {

  const code =
    document
      .getElementById("codeInput")
      .value
      .trim();


  const status =
    document
      .getElementById("pcStatus");


  /* CHECK CODE */

  if (
    !/^\d{6}$/.test(code)
  ) {

    status.textContent =
      "⚠️ Enter exactly 6 digits.";

    return;

  }


  status.textContent =
    "🌐 Finding phone...";


  /* DESTROY OLD */

  if (pcPeer) {

    try {
      pcPeer.destroy();
    }
    catch (e) {}

  }


  /* CREATE PC PEER */

  pcPeer =
    new Peer(
      undefined,
      peerConfig
    );


  /* PEER READY */

  pcPeer.on(
    "open",
    function(id) {

      console.log(
        "PC PEER:",
        id
      );


      status.textContent =
        "🌐 Connecting to phone...";


      /* DATA CONNECTION */

      pcDataConnection =
        pcPeer.connect(
          code,
          {
            reliable: true
          }
        );


      /* OPEN */

      pcDataConnection.on(
        "open",
        function() {

          console.log(
            "🟢 PC CONNECTED"
          );


          status.textContent =
            "🟢 Phone found! Waiting for camera...";

        }
      );


      /* RECEIVE OFFER */

      pcDataConnection.on(
        "data",
        async function(message) {

          console.log(
            "PC RECEIVED:",
            message
          );


          if (
            message &&
            message.type === "OFFER"
          ) {

            status.textContent =
              "📡 Camera found! Starting video...";


            await receiveOffer(
              message.sdp
            );

          }

        }
      );


      /* ERROR */

      pcDataConnection.on(
        "error",
        function(error) {

          console.error(
            "PC DATA ERROR:",
            error
          );


          status.textContent =
            "❌ Connection error.";

        }
      );

    }
  );


  /* PEER ERROR */

  pcPeer.on(
    "error",
    function(error) {

      console.error(
        "PC PEER ERROR:",
        error
      );


      if (
        error.type ===
        "peer-unavailable"
      ) {

        status.textContent =
          "❌ Phone not found. Check the code.";

      }

      else {

        status.textContent =
          "❌ " + error.type;

      }

    }
  );

}


/* =================================================
   RECEIVE OFFER
================================================= */

async function receiveOffer(
  offer
) {

  console.log(
    "📡 OFFER RECEIVED"
  );


  /* CREATE RTC */

  pcRTC =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    });


  /* RECEIVE VIDEO */

  pcRTC.addTransceiver(
    "video",
    {
      direction: "recvonly"
    }
  );


  /* VIDEO */

  pcRTC.ontrack =
    function(event) {

      console.log(
        "🔥 VIDEO RECEIVED"
      );


      const video =
        document
          .getElementById("pcVideo");


      if (
        event.streams &&
        event.streams[0]
      ) {

        video.srcObject =
          event.streams[0];

      }

      else {

        const stream =
          new MediaStream();

        stream.addTrack(
          event.track
        );

        video.srcObject =
          stream;

      }


      video.play()
        .then(function() {

          document
            .getElementById("pcStatus")
            .textContent =
            "🟢 LIVE! Phone camera connected.";

        })
        .catch(function(error) {

          console.error(
            error
          );

        });

    };


  /* RTC STATUS */

  pcRTC.onconnectionstatechange =
    function() {

      console.log(
        "PC RTC:",
        pcRTC.connectionState
      );

      if (
        pcRTC.connectionState ===
        "connected"
      ) {

        document
          .getElementById("pcStatus")
          .textContent =
          "🟢 LIVE!";

      }

    };


  /* SET OFFER */

  await pcRTC.setRemoteDescription(
    new RTCSessionDescription(offer)
  );


  /* ANSWER */

  const answer =
    await pcRTC.createAnswer();


  await pcRTC.setLocalDescription(
    answer
  );


  /* SEND ANSWER */

  pcDataConnection.send({

    type: "ANSWER",

    sdp:
      pcRTC.localDescription

  });


  console.log(
    "📡 ANSWER SENT"
  );


  document
    .getElementById("pcStatus")
    .textContent =
    "🟡 Connecting video...";

}


/* =================================================
   CLEANUP
================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (phoneStream) {

      phoneStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }

    if (phonePeer) {

      phonePeer.destroy();

    }

    if (pcPeer) {

      pcPeer.destroy();

    }

  }
);

</script>

</body>
</html>
